# The tests of pdfluent-mcp in its own repository: install the published
# `pdfluent` wheel from PyPI, install this package, start the server over stdio
# and call every tool. This file only runs when this directory is the root of a
# repository (pdfluent/pdfluent-mcp); inside the engine tree the same tests run
# against the wheel built from that tree, in the engine's own workflow.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: The server answers every tool over stdio
        run: python -m pytest -q
