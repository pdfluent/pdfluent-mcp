name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry as io.github.pdfluent/pdfluent-mcp. Authentication is GitHub
# Actions OIDC: the registry grants io.github.<repository_owner>/* from the token, so this only works from a repository
# owned by the pdfluent organisation. No secret is involved. The PyPI package named in server.json must already be
# published (the registry checks the `mcp-name` line in its description).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish server.json
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      # Pinned release and the sha256 of its linux_amd64 tarball, from registry_1.8.1_checksums.txt in the same release.
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install mcp-publisher (checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version
      - name: Validate server.json
        run: ./mcp-publisher validate
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
